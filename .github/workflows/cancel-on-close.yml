# When a PR is closed or merged, its queued and running runs are cancelled:
# every workflow on its head branch, not only the checks. The logic is the
# harness's, called here (owner, 2026-10-30, "Both"); see
# litlfred/cat-harness-tools .github/workflows/layer-cancel-on-close.yml.
name: Cancel the runs of a closed PR

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-cancel-on-close.yml@4ac36f3f401b2f404f434e440c77d20290b46b3b # index.lock.json
