# who-iris's harness checks on every pull request.
#
# Owner, 2026-10-14: "There should be CI running", and ("1") through ONE
# reusable workflow the harness owns, not a copy per repository; and "A
# harnessed repo should run not just core but all of the checks in the
# dependency harness".
#
# This adds to checks.yml, it does not replace it. checks.yml stays as the
# catalogue, pages, covers, Dublin Core renderings and tests job: it runs
# against this repository's OWN index.lock.json, on pushes to main as well as
# on PRs, and every step must pass outright. Here the same check:catalogue,
# iris:pages:check, iris:covers:check and dc:render:check also run as gates,
# alongside the harness graph checks and the checks of folio-assistant-core
# and the layers below it, which checks.yml never ran.
#
# The checks themselves live in cat-harness-tools
# (`.github/workflows/layer-pr-checks.yml`): who-iris swapped into the
# folio-assistant index; typecheck; its tests; and the gates of who-iris and
# its whole dependency harness, failing only on what this PR newly breaks.
name: Harness PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-pr-checks.yml@main
    with:
      instance: who-iris
      path-in-repo: .
      tools-ref: main
      # folio-assistant main pins pre-70lx layers until folio-assistant#2529 merges.
      index-ref: claude/nifty-johnson-w3mspn
