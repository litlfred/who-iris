# Fetch the PDFs of referenced IRIS items so their covers can be rendered.
# Only the small, emblem-masked cover PNGs are ever committed; the PDFs travel
# as a short-lived workflow artifact and are never written to the repository.
name: IRIS cover PDFs
on:
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated item slugs (empty = every referenced item)"
        required: false
        default: ""
  push:
    branches: [claude/iris-cover-pdfs]
    paths: [".github/workflows/iris-cover-pdfs.yml", "scripts/iris-covers/**"]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Can a runner reach IRIS?
        run: curl -sS -o /dev/null -w "iris.who.int: HTTP %{http_code}\n" -A "litlfred-who-iris-covers/0.1" https://iris.who.int/server/api || true
      - name: Fetch referenced PDFs
        run: |
          only="${{ inputs.only }}"
          python3 scripts/iris-covers/fetch-referenced-pdfs.py . out ${only:+--only "$only"}
      - uses: actions/upload-artifact@v4
        with:
          name: iris-cover-pdfs
          path: out
          retention-days: 2
